services:
  web:
    build: .
    image: planoestudo-web:latest
    container_name: planoestudo-web
    restart: unless-stopped
    networks:
      - coolify
    labels:
      - traefik.enable=true
      - traefik.http.routers.planoestudo.rule=Host(`planoestudo.brunokobi.tech`)
      - traefik.http.routers.planoestudo.entrypoints=https
      - traefik.http.routers.planoestudo.tls.certresolver=letsencrypt
      - traefik.http.services.planoestudo.loadbalancer.server.port=80

networks:
  coolify:
    external: true
