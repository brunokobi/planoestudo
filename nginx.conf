server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location = /plano { return 302 /plano.html; }
    location / { try_files $uri $uri/ =404; }
    location ~* \.(js|css)$ { add_header Cache-Control "no-cache"; }
    location ~* \.html$ { add_header Cache-Control "no-cache"; }
}
